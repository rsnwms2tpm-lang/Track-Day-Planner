<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101216"><title>Track Day Heros · Passenger</title><style>html,body{margin:0;min-height:100%;background:#0c100e;color:#eef5f0;font-family:system-ui,-apple-system,sans-serif}main{min-height:100vh;padding:24px;box-sizing:border-box}.card{max-width:520px;margin:8vh auto;padding:24px;border:1px solid #304238;border-radius:20px;background:#121915}.brand{color:#72df9e;font-weight:800}.join{width:100%;padding:13px;border-radius:12px;border:1px solid #72df9e;background:#72df9e;color:#07130c;font-weight:800;font-size:15px}.join[disabled]{opacity:.55}.muted{color:#a8b5ad}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.nav button{padding:12px;border-radius:12px;border:1px solid #34483b;background:#17221b;color:#eaf3ed;font-weight:700}</style></head><body><main><div class="card"><div class="brand">TRACK DAY HEROS 🏁</div><h1>Passenger access</h1><p id="msg" class="muted">Loading your track day…</p><button id="join" class="join" hidden>JOIN THIS TRACK DAY</button><div id="app"></div></div></main><script>(()=>{const BASE='https://uehmbzwnbariqebbxcst.supabase.co/functions/v1/trip-passengers',q=new URLSearchParams(location.search),invite=q.get('passengerInvite'),saved=localStorage.getItem('tdhParticipantToken'),msg=document.getElementById('msg'),join=document.getElementById('join'),app=document.getElementById('app');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function show(token){const r=await fetch(`${BASE}?action=participant&participantToken=${encodeURIComponent(token)}`,{cache:'no-store'}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Passenger access unavailable');msg.hidden=true;join.hidden=true;app.innerHTML=`<h1>${esc(j.participant.name)}</h1><p class="muted">Passenger · Castle Combe</p><div class="nav"><button>Home</button><button>Bingo</button><button>Laps</button></div><h2>Your track day</h2><p>You’re joined as a passenger. Your Bingo and passenger lap areas will live here.</p>`}async function claim(){join.disabled=true;join.textContent='JOINING…';try{const r=await fetch(BASE,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'claim',inviteToken:invite})}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Could not join');localStorage.setItem('tdhParticipantToken',j.participant.participant_token);history.replaceState({},'',location.pathname);await show(j.participant.participant_token)}catch(e){msg.textContent=e.message;join.disabled=false;join.textContent='TRY AGAIN'}}if(invite){msg.textContent='You’ve been invited as a passenger. Join to get your own Bingo and lap area.';join.hidden=false;join.onclick=claim}else if(saved){show(saved).catch(e=>msg.textContent=e.message)}else msg.textContent='This passenger invite is unavailable.'})();</script></body></html>
