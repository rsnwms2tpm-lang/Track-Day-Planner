<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101216"><title>Track Day Heros · Passenger</title><style>html,body{margin:0;min-height:100%;background:#0c100e;color:#eef5f0;font-family:system-ui,-apple-system,sans-serif}main{min-height:100vh;padding:20px;box-sizing:border-box}.card{max-width:520px;margin:5vh auto;padding:22px;border:1px solid #304238;border-radius:20px;background:#121915}.brand{color:#72df9e;font-weight:800}.join,.primary{width:100%;padding:13px;border-radius:12px;border:1px solid #72df9e;background:#72df9e;color:#07130c;font-weight:800;font-size:15px}.join[disabled]{opacity:.55}.muted{color:#a8b5ad}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.nav button{padding:12px;border-radius:12px;border:1px solid #34483b;background:#17221b;color:#eaf3ed;font-weight:700}.nav button.active{border-color:#72df9e;color:#72df9e}.panel{display:none}.panel.active{display:block}.role{display:inline-block;padding:6px 9px;border:1px solid #3c5848;border-radius:999px;color:#b8c9bf;font-size:12px}.info{padding:12px;border:1px solid #2d3b33;border-radius:12px;background:#0e1410;margin:14px 0}.field{margin:12px 0}.field label{display:block;font-size:12px;color:#a8b5ad;margin-bottom:6px}.field input,.field select{width:100%;box-sizing:border-box;padding:12px;border-radius:11px;border:1px solid #34483b;background:#0d130f;color:#eef5f0;font-size:16px}.lap{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #27332c}.lap small{display:block;color:#9eaaa3;margin-top:3px}.empty{color:#8f9b94;font-size:14px}.secondary{padding:10px 12px;border-radius:10px;border:1px solid #3a4c41;background:#17221b;color:#eaf3ed;font-weight:700}.bingo-box{padding:20px;border:1px dashed #3c5848;border-radius:14px;text-align:center;color:#a8b5ad}</style></head><body><main><div class="card"><div class="brand">TRACK DAY HEROS 🏁</div><h1 id="title">Passenger access</h1><p id="msg" class="muted">Loading your track day…</p><button id="join" class="join" hidden>JOIN THIS TRACK DAY</button><div id="app"></div></div></main><script>(()=>{const BASE='https://uehmbzwnbariqebbxcst.supabase.co/functions/v1/trip-passengers',q=new URLSearchParams(location.search),invite=q.get('passengerInvite'),saved=localStorage.getItem('tdhParticipantToken'),msg=document.getElementById('msg'),join=document.getElementById('join'),app=document.getElementById('app'),title=document.getElementById('title');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const lapKey=t=>`tdhPassengerLaps:${t.slice(0,12)}`;const getLaps=t=>{try{return JSON.parse(localStorage.getItem(lapKey(t))||'[]')}catch{return[]}};const saveLaps=(t,v)=>localStorage.setItem(lapKey(t),JSON.stringify(v));const normaliseCars=(cars,p)=>{const seen=new Set();const out=[];for(const c of cars||[]){const driver=c.driver||c.driver_name||c.member_name||c.memberName||c.owner||c.name||'';const car=c.car||c.car_snapshot||c.model||c.vehicle||(!driver?c.name:'')||'';if(!car)continue;const label=driver?`${driver} — ${car}`:car;const key=label.toLowerCase();if(seen.has(key))continue;seen.add(key);out.push({value:label,label,driver,car,memberId:c.member_id||c.memberId||c.id||''})}return out};const defaultCarIndex=(cars,p)=>{const hostId=p.host_member_id||p.hostMemberId||p.added_by_member_id||p.addedByMemberId||p.member_id||p.memberId||'';const hostName=p.host_name||p.hostName||p.driver_name||p.driverName||p.added_by_name||p.addedByName||'';let i=hostId?cars.findIndex(c=>String(c.memberId)===String(hostId)):-1;if(i<0&&hostName)i=cars.findIndex(c=>c.driver.toLowerCase()===String(hostName).toLowerCase());return i>=0?i:(cars.length===1?0:-1)};function renderLaps(token,rawCars=[],p={}){const list=document.getElementById('lapList'),car=document.getElementById('lapCar'),other=document.getElementById('lapOther'),time=document.getElementById('lapTime'),cars=normaliseCars(rawCars,p);const paint=()=>{const laps=getLaps(token);list.innerHTML=laps.length?laps.map((l,i)=>`<div class="lap"><div><b>${esc(l.time)}</b><small>${esc(l.car)}</small></div><button class="secondary" data-del="${i}">Remove</button></div>`).join(''):'<p class="empty">No driving laps recorded yet.</p>';list.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const x=getLaps(token);x.splice(+b.dataset.del,1);saveLaps(token,x);paint()})};if(cars.length){car.innerHTML=cars.map((c,i)=>`<option value="${esc(c.value)}" data-index="${i}">${esc(c.label)}</option>`).join('')+'<option value="__other">Other car…</option>';const di=defaultCarIndex(cars,p);if(di>=0)car.selectedIndex=di;else car.insertAdjacentHTML('afterbegin','<option value="" selected>Choose a Crew car…</option>')}else{car.innerHTML='<option value="__other">Enter car manually…</option>';other.hidden=false}car.onchange=()=>other.hidden=car.value!=='__other';document.getElementById('addLap').onclick=()=>{const chosen=car.value==='__other'?other.value.trim():car.value;if(!chosen||!time.value.trim())return alert('Choose the car and enter the lap time.');const laps=getLaps(token);laps.unshift({car:chosen,time:time.value.trim(),at:new Date().toISOString()});saveLaps(token,laps);time.value='';paint()};paint()}async function show(token){const r=await fetch(`${BASE}?action=participant&participantToken=${encodeURIComponent(token)}`,{cache:'no-store'}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Passenger access unavailable');const p=j.participant||{};msg.hidden=true;join.hidden=true;title.textContent=p.name||'Track day';const track=p.track_name||p.trackName||j.track_name||'Castle Combe';const cars=j.cars||j.crewCars||p.cars||p.crewCars||[];app.innerHTML=`<span class="role">ATTENDING AS PASSENGER</span><p class="muted">${esc(track)}</p><div class="nav"><button class="active" data-tab="home">Home</button><button data-tab="bingo">Bingo</button><button data-tab="laps">Laps</button></div><section class="panel active" data-panel="home"><h2>Your track day</h2><div class="info"><b>You’re here as a passenger.</b><p class="muted">That describes how you joined this trip — it doesn’t stop you driving. If you have a go in one of the Heros’ cars, record your own driving laps under Laps.</p></div><p class="muted">You only see the parts of Track Day Heros that are relevant to you. The group’s planning and logistics stay with the Heros.</p></section><section class="panel" data-panel="bingo"><h2>Bingo</h2><div class="bingo-box">Your track-day Bingo will live here.<br><br><b>Same game. Same trip. Your own card.</b></div></section><section class="panel" data-panel="laps"><h2>Your driving laps</h2><p class="muted">Record the times you set when you drive — whether it’s the car you came with or another Hero’s car.</p><div class="field"><label>Crew car you drove</label><select id="lapCar"></select><input id="lapOther" hidden placeholder="Car / driver, e.g. Dave — Clio 172"></div><div class="field"><label>Lap time</label><input id="lapTime" inputmode="decimal" placeholder="e.g. 1:20.54"></div><button id="addLap" class="primary">ADD DRIVING LAP</button><div id="lapList"></div></section>`;app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{app.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));app.querySelectorAll('[data-panel]').forEach(x=>x.classList.toggle('active',x.dataset.panel===b.dataset.tab))});renderLaps(token,cars,p)}async function claim(){join.disabled=true;join.textContent='JOINING…';try{const r=await fetch(BASE,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'claim',inviteToken:invite})}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Could not join');localStorage.setItem('tdhParticipantToken',j.participant.participant_token);history.replaceState({},'',location.pathname);await show(j.participant.participant_token)}catch(e){msg.textContent=e.message;join.disabled=false;join.textContent='TRY AGAIN'}}if(invite){msg.textContent='You’ve been invited to this track day as a passenger. Join for your own Track Day, Bingo and driving-laps area.';join.hidden=false;join.onclick=claim}else if(saved){show(saved).catch(e=>msg.textContent=e.message)}else msg.textContent='This passenger invite is unavailable.'})();</script></body></html>
