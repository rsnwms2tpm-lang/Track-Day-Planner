<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TDH Bingo Lab v10</title><style>body{margin:0;background:#090b10;color:#f5f5f5;font-family:system-ui}.wrap{max-width:560px;margin:auto;padding:28px 18px 60px}.card,.prediction{background:#151922;border:1px solid #292f3b;border-radius:18px;padding:18px;margin:16px 0}.scenario,.primary,.prediction button{width:100%;border:0;border-radius:12px;padding:15px;margin:7px 0;font-weight:900}.scenario{background:#202632;color:white;text-align:left}.primary,.prediction button{background:white;color:#090b10}.muted{opacity:.65;font-size:14px}.actual{border-left:4px solid white;padding-left:12px;margin:12px 0}.pill{font-size:11px;border:1px solid #555;border-radius:99px;padding:4px 8px}h1{font-size:28px;line-height:1.08;margin:8px 0 14px}h2{font-size:20px;margin:8px 0}.card,.prediction{line-height:1.4}.prediction p{margin:7px 0 4px}.choice-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.choice-row button{margin:0;min-height:58px}.ff-new{animation:ffIn .28s ease-out}@keyframes ffIn{from{opacity:.15;transform:translateX(18px)}to{opacity:1;transform:none}}.winner{text-align:center}</style></head><body><div class="wrap"><b>Track Day Heros 🏁</b><div class="muted">BINGO RESULTS LAB · V10 · ISOLATED TEST DATA</div><div id="app"></div></div><script>
const S=[{n:'MULTIPLE CAR MATCHES',l:[['Clio 172','Cooling','Coolant hose split'],['Civic Type R','Gearbox','Lost third gear']],p:[['Clio 172','Cooling','Top hose lets go','Tommy'],['Clio 172','Electrical','Alternator dies','Joe'],['Civic Type R','Gearbox','Loses third gear','Dave'],['Civic Type R','Brakes','Front pads vanish','Frank']]},{n:'CATEGORY FALLBACK',l:[['Clio 172','Cooling','Radiator hose split'],['Civic Type R','Gearbox','Lost third gear']],p:[['BMW M3','Cooling','Radiator hose lets go','Dave'],['MX-5','Cooling','Overheats and dumps coolant','Joe'],['Fabia','Gearbox','Loses a gear','Tommy'],['GT4','Electrical','Battery light','Frank']]},{n:'FREE FOR ALL 😂',l:[['Clio 172','Cooling','Coolant hose split'],['MX-5','Tyre / Wheel','Front-left tyre puncture'],['BMW M3','Bodywork / Aero','Front splitter cracked'],['Megane RS','Suspension','Rear damper leaking'],['GR Yaris','Steering','Power steering warning'],['Integra Type R','Fuel','Fuel starvation in long right-hander'],['Fiesta ST','Driver Error 😂','Black flagged for noise after repeated warning']],p:[['Civic Type R','Gearbox','Loses third gear','Dave'],['GT4','Electrical','Alternator packs up','Joe'],['Fabia','Brakes','Boils brakes','Tommy'],['Clio 182','Engine','Coil pack gives up','Frank'],['Impreza','Drivetrain','CV joint fails','Ben'],['E46 M3','Gearbox','Second gear synchro goes','Sam'],['Elise','Electrical','Battery terminal works loose','Alex'],['Focus RS','Brakes','Front pads disappear by lunch','Chris']]},{n:'SPOTLESS DAY 😂',l:[],p:[['Clio 172','Engine','Throws a rod through the bonnet before lunch','Dave'],['Civic Type R','Bodywork / Aero','Rear wing achieves independent flight','Frank'],['GT4','Driver Error 😂','Binned leaving paddock at 4 mph','Tommy'],['Fabia','Cooling','Radiator explodes on sighting lap','Joe']]}];let si=0,keys=[],k=0,finals=[],ffIndex=0,ffKeeps=[];const A=document.getElementById('app'),E=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function home(){A.innerHTML='<div class="card"><h1>Broken Car Bingo test lab 🧪</h1><p>Safe fake data only — this does not touch Combe. You play as Dave; Frank, Joe and Tommy are simulated.</p></div>'+S.map((s,i)=>'<button class="scenario" onclick="si='+i+';start()">'+s.n+'</button>').join('')}
function ev(t){let rows=S[si].l;if(t==='car')rows=rows.filter(x=>x[0]===keys[k]);if(t==='cat')rows=rows.filter(x=>x[1]===keys[k]);return rows.map(x=>'<div class="actual"><b>'+E(x[0])+'</b><br>'+E(x[1])+' · '+E(x[2])+'</div>').join('')}
function start(){let s=S[si];finals=[];k=0;if(!s.l.length)return vote('WAIT... NOTHING BROKE?! 😳','MOST RIDICULOUS PREDICTION 😂🏆',s.p,'rid');let cars=[...new Set(s.l.map(x=>x[0]))];keys=cars.filter(c=>s.p.some(p=>p[0]===c));if(keys.length)return per('car');keys=[...new Set(s.l.map(x=>x[1]))].filter(c=>s.p.some(p=>p[1]===c));if(keys.length)return per('cat');freePass()}
function per(t){let ps=S[si].p.filter(p=>p[t==='car'?0:1]===keys[k]);vote(t==='car'?'CAR MATCH 🏁':'NO CAR MATCHES 😬',keys[k]+' — WHO GOT CLOSEST?',ps,t)}
function freePass(){ffIndex=0;ffKeeps=[];renderFreePass()}
function renderFreePass(){const s=S[si],p=s.p[ffIndex];A.innerHTML='<div class="ff-new"><div class="card"><div class="muted">FREE FOR ALL 😂 · QUICK PASS</div><h1>Could this be the closest?</h1><div class="muted">NEW PREDICTION · '+(ffIndex+1)+' OF '+s.p.length+'</div><div class="prediction"><b>'+E(p[0])+'</b><div>'+E(p[1])+'</div><p>'+E(p[2])+'</p></div><div class="choice-row"><button class="scenario" onclick="freeChoice(false)">✕ NOT CLOSE</button><button class="primary" onclick="freeChoice(true)">KEEP ✓</button></div><h2>ALL '+s.l.length+' ACTUAL FAILURES</h2>'+s.l.map((x,i)=>'<div class="actual"><b>'+E(x[0])+'</b><br>'+E(x[1])+' · '+E(x[2])+'</div>').join('')+'</div></div>';scrollTo({top:0,behavior:'smooth'})}
function freeChoice(keep){if(keep)ffKeeps.push(ffIndex);ffIndex++;if(ffIndex<S[si].p.length)return renderFreePass();let pool=ffKeeps.map(i=>S[si].p[i]);if(!pool.length)pool=S[si].p.slice();if(pool.length===1)return win(pool[0],'free');finals=pool;vote('FREE FOR ALL 😂 · FINAL VOTE','WHO GOT ABSOLUTELY CLOSEST? 🏆',pool,'final')}
function vote(a,b,ps,t){
 A.innerHTML='<div class="card"><div class="muted">'+a+'</div><h1>'+E(b)+'</h1>'+(S[si].l.length?'<h2>What actually happened</h2>'+ev(t):'')+'<p class="muted">Pick the closest prediction.</p></div>'+ps.map((p,i)=>'<div class="prediction"><b>'+E(p[0])+'</b><div>'+E(p[1])+'</div><p>'+E(p[2])+'</p><button onclick="pick('+i+',\''+t+'\')">VOTE FOR THIS →</button></div>').join('')
}
function pick(i,t){let s=S[si],ps=t==='car'?s.p.filter(p=>p[0]===keys[k]):t==='cat'?s.p.filter(p=>p[1]===keys[k]):t==='final'?finals:s.p,p=ps[i];if(t==='car'||t==='cat'){finals.push(p);if(++k<keys.length)return per(t);if(finals.length>1)return vote('FINALISTS 🏁','WHO GOT ABSOLUTELY CLOSEST? 🏆',finals,'final')}win(p,t)}
function win(p,t){A.innerHTML='<div class="winner"><div class="muted">'+(t==='rid'?'MOST RIDICULOUS PREDICTION 😂🏆':'BROKEN CAR BINGO 🏆')+'</div><h1>WE HAVE A WINNER.</h1><div class="card"><div class="muted">WINNING PREDICTION</div><h2>'+E(p[0])+'</h2><div>'+E(p[1])+'</div><p>'+E(p[2])+'</p></div><div class="card"><div class="muted">AND THE HERO BEHIND IT IS...</div><h1>'+E(p[3])+' 🏆</h1></div><button class="primary" onclick="home()">← TEST ANOTHER SCENARIO</button></div>'}home();
</script></body></html>
