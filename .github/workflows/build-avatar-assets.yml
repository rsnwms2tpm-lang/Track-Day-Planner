name: Build avatar assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Crop static avatar source into JPEGs
        run: |
          python - <<'PY'
          import base64, io, os
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True

          data = base64.b64decode(open('.avatar-sheet-small.txt','r',encoding='utf-8').read().strip())
          im = Image.open(io.BytesIO(data)).convert('RGB')
          helmets=['classic-white','stealth','red-rocket','blue-thunder','high-viz','matte-black','retro','orange-fury','purple-haze','m-power','british-bulldog','skull','pink-speed','camo','chicken','rainbow']
          drivers=['clean-cut','bearded','stubble','shades','cap','balaclava','glasses','older-pro','bald-stubble','bald-beard','long-hair','moustache','headphones','bucket-hat','wild-card','track-rat']
          os.makedirs('assets/avatars',exist_ok=True)
          cell_w = im.width // 8
          cell_h = im.height // 4

          def save(kind,names,row0):
              for i,name in enumerate(names):
                  row=row0+i//8
                  col=i%8
                  box=(col*cell_w,row*cell_h,(col+1)*cell_w,(row+1)*cell_h)
                  crop=im.crop(box).resize((96,96),Image.Resampling.LANCZOS)
                  crop.save(f'assets/avatars/{kind}-{i+1:02d}-{name}.jpg','JPEG',quality=88,optimize=True)

          save('helmet',helmets,0)
          save('driver',drivers,2)
          print('Generated',len(helmets)+len(drivers),'avatar JPEGs from',im.size)
          PY
      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/avatars/*.jpg
          if git diff --cached --quiet; then
            echo 'Avatar assets already current'
          else
            git commit -m 'Regenerate static avatar JPEG assets [skip ci]'
            git push
          fi
